<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SIGILWEAVER — Phase 0 Spike</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e14; color: #cdd6f4; font-family: ui-monospace, Menlo, monospace;
      height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
    }
    #stage { position: relative; flex: 1; min-height: 0; }
    #video { display: none; }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
    #hud {
      position: absolute; top: 8px; left: 8px; right: 8px;
      font-size: 12px; line-height: 1.5; white-space: pre; pointer-events: none;
      text-shadow: 0 1px 2px #000;
    }
    #gesture {
      position: absolute; bottom: 16px; left: 0; right: 0; text-align: center;
      font-size: 42px; font-weight: bold; pointer-events: none;
      text-shadow: 0 0 24px #7c6cff;
    }
    #flash {
      position: absolute; inset: 0; background: #7c6cff; opacity: 0;
      pointer-events: none; transition: opacity 0.25s ease-out;
    }
    #start {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0b0e14; z-index: 10; flex-direction: column; gap: 16px;
    }
    #start button {
      font-size: 20px; padding: 16px 32px; background: #7c6cff; color: #fff;
      border: none; border-radius: 12px; font-family: inherit;
    }
    #start p { font-size: 13px; color: #8891ab; text-align: center; padding: 0 24px; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
    <div id="flash"></div>
    <div id="hud"></div>
    <div id="gesture"></div>
    <div id="recorder" style="position:absolute; top:8px; right:8px; display:flex; gap:6px; align-items:center; z-index:5;">
      <select id="recLabel" style="font-family:inherit; font-size:12px; background:#1a1f2e; color:#cdd6f4; border:1px solid #2a2f45; border-radius:6px; padding:4px;">
        <option>BOLT</option><option>WARD</option><option>PULSE</option><option>ARC</option><option>FOCUS</option><option>MIXED</option>
      </select>
      <button id="recBtn" style="font-family:inherit; font-size:12px; background:#1a1f2e; color:#cdd6f4; border:1px solid #2a2f45; border-radius:6px; padding:4px 10px;">● REC</button>
    </div>
    <div id="start">
      <button id="startBtn">카메라 시작</button>
      <p>전면 카메라로 손을 인식합니다.<br>영상은 저장/전송되지 않습니다.</p>
    </div>
  </div>
  <script type="module" src="/src/debug/spike.ts"></script>
</body>
</html>
